  <style>
    /* ----- RESET & BASE ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      background: #f8fafc;
    }

    /* ----- BRAND COLORS ----- */
    .bg-sef-navy {
      background: #0b1a2f;
    }
    .text-gold {
      color: #fbbf24;
    }
    .border-gold {
      border-color: #fbbf24;
    }

    /* ----- BUTTON STYLES ----- */
    .btn-primary {
      background: #0b1a2f;
      color: white;
      transition: 0.2s;
    }
    .btn-primary:hover {
      background: #1a2f4a;
      transform: translateY(-2px);
    }

    .btn-gold {
      background: #fbbf24;
      color: #0b1a2f;
      transition: 0.2s;
    }
    .btn-gold:hover {
      background: #f59e0b;
      transform: translateY(-2px);
    }

    /* ----- HOVER EFFECTS ----- */
    .hover-scale {
      transition: all 0.2s ease;
    }
    .hover-scale:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.15);
    }

    /* ----- SAVINGS BADGE ANIMATION ----- */
    .savings-badge {
      background: linear-gradient(145deg, #fbbf24, #f59e0b);
      animation: pulse-soft 2s infinite;
    }
    @keyframes pulse-soft {
      0%,
      100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.04);
      }
    }

    /* ----- IMAGE HOVER ZOOM ----- */
    .store-image-container {
      overflow: hidden;
      position: relative;
    }
    .store-image-container img {
      transition: transform 0.4s ease;
    }
    .store-image-container:hover img {
      transform: scale(1.06);
    }

    /* ----- FILTER BUTTON ACTIVE STATE ----- */
    .filter-active {
      background: #0b1a2f !important;
      color: white !important;
      box-shadow: 0 4px 12px rgba(11, 26, 47, 0.3);
    }

    /* ----- CATEGORY BADGE ----- */
    .category-badge {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: rgba(11, 26, 47, 0.85);
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* ----- STOCK INDICATOR ----- */
    .in-stock {
      color: #22c55e;
    }
    .low-stock {
      color: #eab308;
    }
  </style>

    // =============================================
    // RENDER FUNCTION
    // =============================================

    function renderSpecials(list) {
      const grid = document.getElementById('specialsGrid');

      if (!list.length) {
        grid.innerHTML = `
          <div class="col-span-full text-center py-16">
            <p class="text-gray-500 text-lg">No specials found.</p>
            <button onclick="filterSpecials('all')" class="btn-primary mt-4 px-6 py-2 rounded-lg">View All Specials</button>
          </div>
        `;
        return;
      }

      grid.innerHTML = list.map(sp => {
        // Determine stock indicator
        const stockClass = sp.stock === 'In Stock' ? 'in-stock' : 'low-stock';
        const stockIcon = sp.stock === 'In Stock' ? '✅' : '⚠️';

        // Category emoji mapping
        const categoryEmojis = {
          'food': '🍞',
          'beverages': '🥤',
          'household': '🧹',
          'meat': '🥩'
        };
        const categoryEmoji = categoryEmojis[sp.category] || '🛒';

        return `
          <div class="hover-scale bg-white rounded-xl shadow-lg overflow-hidden border border-gray-200 transition-all duration-300">
            <div class="store-image-container h-52 relative">
              <img src="${sp.imageUrl}" alt="${sp.comboName}" class="w-full h-full object-cover" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1542838132-92c53300491e?q=80&w=400&auto=format&fit=crop'">
              ${sp.isFeatured ? '<span class="absolute top-3 right-3 bg-gold text-sef-navy text-xs font-bold px-3 py-1.5 rounded-full shadow-lg">⭐ FEATURED</span>' : ''}
              <span class="category-badge">${categoryEmoji} ${sp.category.charAt(0).toUpperCase() + sp.category.slice(1)}</span>
            </div>
            <div class="p-5">
              <h3 class="text-lg font-bold text-sef-navy mb-1">${sp.comboName}</h3>
              <p class="text-gray-600 text-sm">${sp.description}</p>
              <div class="flex items-center justify-between mt-3">
                <div>
                  <span class="text-2xl font-bold text-sef-navy">P${sp.specialPrice.toFixed(2)}</span>
                  <span class="text-gray-400 line-through ml-2 text-sm">P${sp.originalPrice.toFixed(2)}</span>
                </div>
                <span class="savings-badge text-sef-navy text-sm font-bold px-3 py-1.5 rounded-full shadow">Save ${sp.savings}</span>
              </div>
              <div class="flex items-center justify-between mt-3 pt-3 border-t border-gray-100">
                <span class="text-xs font-medium ${stockClass}">${stockIcon} ${sp.stock}</span>
                <button onclick="addToCart('${sp.comboName}', ${sp.specialPrice})" class="btn-primary px-4 py-2 rounded-lg text-sm font-medium transition">
                  🛒 Add to Cart
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // =============================================
    // FILTER FUNCTION
    // =============================================

    function filterSpecials(filter) {
      // Update button styles
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('bg-sef-navy', 'text-white', 'filter-active');
        btn.classList.add('bg-white', 'text-sef-navy');
        if (btn.dataset.filter === filter) {
          btn.classList.remove('bg-white', 'text-sef-navy');
          btn.classList.add('bg-sef-navy', 'text-white', 'filter-active');
        }
      });

      let list = allSpecials;

      switch (filter) {
        case 'featured':
          list = allSpecials.filter(s => s.isFeatured);
          break;
        case 'food':
          list = allSpecials.filter(s => s.category === 'food');
          break;
        case 'beverages':
          list = allSpecials.filter(s => s.category === 'beverages');
          break;
        case 'household':
          list = allSpecials.filter(s => s.category === 'household');
          break;
        case 'meat':
          list = allSpecials.filter(s => s.category === 'meat');
          break;
        default:
          list = allSpecials;
      }

      renderSpecials(list);
    }

    // =============================================
    // ADD TO CART FUNCTION
    // =============================================

    function addToCart(name, price) {
      // Show a nice notification instead of basic alert
      const notification = document.createElement('div');
      notification.className = 'fixed bottom-4 right-4 bg-green-500 text-white px-6 py-3 rounded-lg shadow-2xl z-50 transform transition-all duration-500 translate-y-0 opacity-100';
      notification.innerHTML = `
        <div class="flex items-center gap-3">
          <span class="text-2xl">🛒</span>
          <div>
            <p class="font-semibold">${name}</p>
            <p class="text-sm opacity-90">Added to cart • P${price.toFixed(2)}</p>
          </div>
        </div>
      `;
      document.body.appendChild(notification);

      // Remove notification after 3 seconds
      setTimeout(() => {
        notification.style.transform = 'translateY(100px)';
        notification.style.opacity = '0';
        setTimeout(() => notification.remove(), 500);
      }, 3000);

      // Update cart badge (demo)
      const badge = document.querySelector('.absolute.-top-1.-right-2');
      if (badge) {
        const current = parseInt(badge.textContent) || 0;
        badge.textContent = current + 1;
      }
    }

    // =============================================
    // MOBILE MENU TOGGLE
    // =============================================

    function toggleMobileMenu() {
      document.getElementById('mobileMenu').classList.toggle('hidden');
    }

    // Close mobile menu when a link is clicked
    document.querySelectorAll('#mobileMenu a').forEach(a =>
      a.addEventListener('click', () => document.getElementById('mobileMenu').classList.add('hidden'))
    );

    document.querySelector('.filter-btn[data-filter="all"]').classList.add('bg-sef-navy', 'text-white', 'filter-active');
